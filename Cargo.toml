[package]
name = "paga"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Async Rust SDK for the Paga Engine API - payments, payouts, wallets and financial operations."
license = "GPL-3.0"
keywords = ["paga", "payments", "payouts", "fintech", "open-banking", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "README.md"
repository = "https://github.com/TeamTrustBridge/paga-rs"
homepage = "https://github.com/TeamTrustBridge/paga-rs"
documentation = "https://github.com/TeamTrustBridge/paga-rs#readme"

[lib]
name = "paga"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
