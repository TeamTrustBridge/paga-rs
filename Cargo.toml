[package]
name = "paga"
version = "0.1.0"
edition = "2021"
description = "Async Rust SDK for the Paga Engine API - payments, payouts, wallets and financial operations."
license = "GPL-3.0"
repository = "https://github.com/TeamTrustBridge/paga-rs"

[lib]
name = "paga"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
